name: Kubernetes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: App unit tests
        run: |
          pip install -r app/requirements.txt pytest
          cd app && python -m pytest -q
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate rendered manifests (dev + prod)
        run: |
          for env in dev prod; do
            echo "== $env =="
            kubectl kustomize k8s/overlays/$env | kubeconform -strict -summary -kubernetes-version 1.30.0
          done

  e2e-kind:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - name: Deploy dev overlay to kind
        run: CLUSTER=kind ./scripts/deploy-local.sh
      - name: End-to-end tests
        run: ./scripts/test-cluster.sh
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n k8s-demo get all
          kubectl -n k8s-demo describe pods
          kubectl -n k8s-demo logs -l component=web --tail=50
