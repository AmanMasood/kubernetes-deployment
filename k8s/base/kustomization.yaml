apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: k8s-demo   # also applies to the generated Secret
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
secretGenerator:
  - name: k8s-demo-secret
    envs:
      - secret.env
generatorOptions:
  disableNameSuffixHash: false
labels:
  - pairs:
      app.kubernetes.io/name: k8s-demo
      app.kubernetes.io/part-of: devops-portfolio
    includeSelectors: true
