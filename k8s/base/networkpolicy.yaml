# Only allow inbound HTTP to the web pods (from anywhere inside the cluster / ingress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-demo-allow-http
  namespace: k8s-demo
spec:
  podSelector:
    matchLabels:
      component: web
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
