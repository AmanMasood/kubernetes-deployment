apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: k8s-demo
    newName: ghcr.io/amanmasood/k8s-demo
    newTag: "1.0.0"
patches:
  - target: {kind: ConfigMap, name: k8s-demo-config}
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: production
  - target: {kind: Deployment, name: k8s-demo}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: {kind: Ingress, name: k8s-demo}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: k8s-demo.example.com
